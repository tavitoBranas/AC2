# La app consulta la API de Kubernetes para leer su propio nodo
# (providerID aws:///..., labels eks.amazonaws.com/*) como evidencia de EKS.
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: web-app
  name: web-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: web-app-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: web-app-node-reader
subjects:
  - kind: ServiceAccount
    namespace: web-app
    name: web-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: web-app-node-reader
